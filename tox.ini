[testenv]
# Use uv for faster dependency installation
package = wheel
wheel_build_env = .pkg
runner = uv-venv-runner
deps =
    black
    isort
    pylint
    pytest
commands =
    {envpython} --version

[testenv:lint]
commands =
    {envpython} --version
    pioinstaller --version
    pylint --rcfile=./.pylintrc ./pioinstaller

[testenv:format]
commands =
    black --check ./pioinstaller ./tests
    isort --check-only ./pioinstaller ./tests

[testenv:test]
commands =
    pytest --verbose tests