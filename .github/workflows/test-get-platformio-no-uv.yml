name: Test get-platformio.py without uv

on:
  workflow_dispatch:      # Start a workflow
  push:

jobs:
  test-uv-download-fallback:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    name: Test uv download fallback (no curl / musl path)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ensure uv is not installed
        run: |
          pip uninstall -y uv || true
          if python -m uv --version 2>/dev/null; then exit 1; fi
        shell: bash
      - name: Mask curl from PATH to force install_uv_download() fallback
        run: |
          mkdir -p "$HOME/.bin-mask"
          # Provide a stub that always fails so install_uv_with_official_script returns None
          printf '#!/bin/sh\nexit 127\n' > "$HOME/.bin-mask/curl"
          chmod +x "$HOME/.bin-mask/curl"
          echo "$HOME/.bin-mask" >> "$GITHUB_PATH"
        shell: bash
      - name: Run get-platformio.py (must use install_uv_download fallback)
        run: python get-platformio.py
        shell: bash
      - name: Verify uv is installed in PlatformIO penv
        run: ~/.platformio/penv/bin/uv --help
        shell: bash

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15, macos-15-intel]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-11-arm
            python-version: "3.9"
          - os: windows-11-arm
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ensure uv is not installed
        run: |
          pip uninstall -y uv || true
          if python -m uv --version 2>/dev/null; then exit 1; fi
        shell: bash
      - name: Remove Homebrew Python (macOS)
        if: runner.os == 'macOS'
        run: |
          # Liste alle installierten Python-Versionen von Homebrew auf
          brew list --formula | grep '^python@' | while read formula; do
            echo "Uninstalling $formula"
            brew uninstall --ignore-dependencies --force "$formula"
          done
          # Entferne auch unversioniertes python falls vorhanden
          if brew list python &>/dev/null; then
            brew uninstall --ignore-dependencies --force python
          fi
          # Entferne Symlinks in /usr/local/bin
          sudo rm -f /usr/local/bin/python* /usr/local/bin/pip* /usr/local/bin/2to3*
        shell: bash
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run get-platformio.py
        run: |
          python get-platformio.py
        shell: bash
      - name: Install PlatformIO Core
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ~/.platformio/penv/Scripts/pio.exe system info
          else
            ~/.platformio/penv/bin/pio system info
          fi
        shell: bash
      - name: Verify uv is installed in PlatformIO penv
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ~/.platformio/penv/Scripts/uv.exe --help
          else
            ~/.platformio/penv/bin/uv --help
          fi
        shell: bash
